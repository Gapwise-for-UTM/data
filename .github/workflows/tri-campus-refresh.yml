name: Tri-campus source refresh

on:
  workflow_dispatch:
  push:
    branches:
      - codex/tri-campus-data-2026-09-18
      - codex/complete-tri-campus-geometry-2026-09-18
      - codex/sync-robarts-common-generated
      - codex/friendly-utsg-building-names-2026-09-18
    paths:
      - ".github/workflows/tri-campus-refresh.yml"
      - "scripts/refresh-tri-campus-candidates.mjs"
      - "scripts/validate-tri-campus-data.mjs"
      - "data/utsg/source.json"
      - "data/utsg/sources/**"
      - "data/utsc/source.json"
      - "data/utsc/sources/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tri-campus-source-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[tri-campus generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh UTSG and UTSC geometry from current cached timetable evidence
        env:
          GAPWISE_REUSE_TTB: "1"
          GAPWISE_SKIP_OVERPASS: "1"
        run: node scripts/refresh-tri-campus-candidates.mjs

      - name: Validate generated tri-campus data
        run: node scripts/validate-tri-campus-data.mjs

      - name: Check generated diff
        run: git diff --check

      - name: Commit generated evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Gapwise Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            data/tri-campus-coverage.json \
            data/utsg/buildings.json \
            data/utsg/buildings.geojson \
            data/utsg/generated \
            data/utsc/buildings.json \
            data/utsc/buildings.geojson \
            data/utsc/generated
          if git diff --cached --quiet; then
            echo "Generated evidence is unchanged."
            exit 0
          fi
          git commit -m "data: refresh tri-campus evidence [tri-campus generated]"

          if [ "${GITHUB_REF_NAME}" = "${{ github.event.repository.default_branch }}" ]; then
            refresh_branch="automation/tri-campus-refresh"
            git push --force-with-lease origin "HEAD:refs/heads/${refresh_branch}"
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "${refresh_branch}" \
              --title "Refresh generated tri-campus evidence" \
              --body "Automated canonical UTSG/UTSC runtime snapshot refresh. Generated and validated by the tri-campus source refresh workflow." \
              || echo "Refresh PR already exists."
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
