name: Sync OPH restrictive access

on:
  push:
    branches: [sync/oph-restrictive-access]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sync/oph-restrictive-access
      - name: Copy exact Gapwise reviewed data
        env:
          SOURCE_SHA: fb80ab0873c4d3551cd31ec0f6f10f41eb678c3e
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/Gapwise-for-UTM/gapwise/${SOURCE_SHA}/src/data/utm"
          curl --fail --silent --show-error --location "$base/entrances.geojson" -o data/utm/entrances.geojson
          curl --fail --silent --show-error --location "$base/generated/campus-access-audit.json" -o data/utm/generated/campus-access-audit.json
          curl --fail --silent --show-error --location "$base/generated/entrance-audit.geojson" -o data/utm/generated/entrance-audit.geojson
          curl --fail --silent --show-error --location "$base/outdoor-nodes.geojson" -o data/utm/outdoor-nodes.geojson

          test "$(git hash-object data/utm/entrances.geojson)" = "6860abbc3926311ca07819612129b281eb6e7322"
          test "$(git hash-object data/utm/generated/campus-access-audit.json)" = "7f4bc88852ea7e65bf25b256f2d47660a280bc68"
          test "$(git hash-object data/utm/generated/entrance-audit.geojson)" = "33257d45015100a0fc406bc28778e579ed0f5235"
          test "$(git hash-object data/utm/outdoor-nodes.geojson)" = "e2ebaf7aad0106a6287751aa24e770104b01581e"

          (
            cd data/utm
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #' > SHA256SUMS
          )
      - name: Validate canonical data
        run: |
          node scripts/validate-campus-data.mjs
          node scripts/check-public-distribution.mjs
      - name: Commit exact mirror and remove staging workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-oph-restrictive-access.yml
          git add data/utm/entrances.geojson data/utm/generated/campus-access-audit.json data/utm/generated/entrance-audit.geojson data/utm/outdoor-nodes.geojson data/utm/SHA256SUMS
          if git diff --cached --quiet; then
            echo "No canonical data changes to commit."
            exit 1
          fi
          git commit -m "sync(utm): preserve restrictive OPH entrance access"
          git push origin HEAD:sync/oph-restrictive-access
