name: Sync outdoor node entrance freshness

on:
  push:
    branches:
      - sync/outdoor-node-entrance-freshness-2026-09-14
    paths:
      - .github/workflows/sync-outdoor-node-entrance-freshness.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/outdoor-node-entrance-freshness-2026-09-14
      - name: Copy exact reviewed Gapwise routing-node snapshot
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/Gapwise-for-UTM/gapwise/7ba4f4c74a389ed47ae319efefd1e1426d02b1af/src/data/utm/outdoor-nodes.geojson \
            --output data/utm/outdoor-nodes.geojson
      - name: Refresh outdoor-nodes checksum
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const checksumPath = 'data/utm/SHA256SUMS';
          const targetPath = 'data/utm/outdoor-nodes.geojson';
          const digest = crypto.createHash('sha256').update(fs.readFileSync(targetPath)).digest('hex');
          const lines = fs.readFileSync(checksumPath, 'utf8').trimEnd().split('\n');
          const next = lines.map((line) => line.endsWith('  outdoor-nodes.geojson') ? `${digest}  outdoor-nodes.geojson` : line);
          fs.writeFileSync(checksumPath, `${next.join('\n')}\n`);
          NODE
      - name: Validate canonical campus dataset
        run: node scripts/validate-campus-data.mjs
      - name: Commit synchronized derivative and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/sync-outdoor-node-entrance-freshness.yml
          git add data/utm/outdoor-nodes.geojson data/utm/SHA256SUMS .github/workflows/sync-outdoor-node-entrance-freshness.yml
          git diff --cached --quiet && { echo "Expected synchronized data changes were not produced"; exit 1; }
          git commit -m "data(utm): refresh routed entrance node evidence"
          git push origin HEAD:sync/outdoor-node-entrance-freshness-2026-09-14
