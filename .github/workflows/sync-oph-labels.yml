name: Sync reviewed OPH entrance artifacts

on:
  push:
    branches:
      - sync/oph-labels-20260914
    paths:
      - .github/workflows/sync-oph-labels.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/oph-labels-20260914
          fetch-depth: 0
      - name: Fetch exact reviewed artifacts from Gapwise PR head
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/Gapwise-for-UTM/gapwise/e645b9703e1a5437e523ffb7ff955307b0ba0272/src/data/utm'
          curl --fail --location --silent --show-error "$base/entrances.geojson" -o data/utm/entrances.geojson
          curl --fail --location --silent --show-error "$base/generated/entrance-audit.geojson" -o data/utm/generated/entrance-audit.geojson
          curl --fail --location --silent --show-error "$base/outdoor-nodes.geojson" -o data/utm/outdoor-nodes.geojson
      - name: Regenerate UTM checksums
        shell: bash
        run: |
          set -euo pipefail
          cd data/utm
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #' > SHA256SUMS
      - name: Commit synchronized artifacts and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/sync-oph-labels.yml
          git add data/utm/entrances.geojson data/utm/generated/entrance-audit.geojson data/utm/outdoor-nodes.geojson data/utm/SHA256SUMS .github/workflows/sync-oph-labels.yml
          git diff --cached --quiet && exit 1
          git commit -m 'sync(utm): preserve evidence-safe OPH labels'
          git push origin HEAD:sync/oph-labels-20260914
