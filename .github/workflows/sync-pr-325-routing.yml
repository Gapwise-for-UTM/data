name: Sync PR 325 routing snapshot

on:
  push:
    branches:
      - sync/all-campus-entrances-325
    paths:
      - .github/workflows/sync-pr-325-routing.yml

permissions:
  contents: write

jobs:
  sync-routing-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/all-campus-entrances-325
          fetch-depth: 0

      - name: Fetch exact reviewed routing artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_commit=d495be4ab902bb3de2063ee4734c23da7f00eb41
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Gapwise-for-UTM/gapwise/${source_commit}/src/data/utm/outdoor-edges.json" \
            --output /tmp/outdoor-edges.json
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Gapwise-for-UTM/gapwise/${source_commit}/src/data/utm/outdoor-nodes.geojson" \
            --output /tmp/outdoor-nodes.geojson

          test "$(git hash-object /tmp/outdoor-edges.json)" = "b35e5a817b37b48d9845f1d70810df6770b74ab7"
          test "$(git hash-object /tmp/outdoor-nodes.geojson)" = "5b68d2fdf2678f385d2f8adf64a6d32a9cd7d8c2"

          cp /tmp/outdoor-edges.json data/utm/outdoor-edges.json
          cp /tmp/outdoor-nodes.geojson data/utm/outdoor-nodes.geojson

      - name: Regenerate canonical checksums
        shell: bash
        run: |
          set -euo pipefail
          find data/utm -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  data/utm/#  #' \
            > data/utm/SHA256SUMS

      - name: Validate canonical dataset
        run: |
          node scripts/validate-campus-data.mjs
          node scripts/check-public-distribution.mjs

      - name: Commit exact routing snapshot and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "andrewmuratov"
          git config user.email "andrewamuratov@gmail.com"
          git add data/utm/outdoor-edges.json data/utm/outdoor-nodes.geojson data/utm/SHA256SUMS
          git rm .github/workflows/sync-pr-325-routing.yml
          git diff --cached --check
          git commit -m "sync(utm): publish reviewed routing graph"
          git push origin HEAD:sync/all-campus-entrances-325
