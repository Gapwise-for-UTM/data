name: Sync OSM entrance freshness

on:
  push:
    branches:
      - sync/osm-entrance-freshness-2026-09-14
    paths:
      - .github/workflows/sync-osm-entrance-freshness.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/osm-entrance-freshness-2026-09-14
      - name: Copy exact reviewed Gapwise entrance snapshot
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/Gapwise-for-UTM/gapwise/d3f7d57d91c4c9de98ccc0f53dcd1851d89dd935/src/data/utm/entrances.geojson \
            --output data/utm/entrances.geojson
      - name: Refresh entrance checksum
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const checksumPath = 'data/utm/SHA256SUMS';
          const entrancePath = 'data/utm/entrances.geojson';
          const digest = crypto.createHash('sha256').update(fs.readFileSync(entrancePath)).digest('hex');
          const lines = fs.readFileSync(checksumPath, 'utf8').trimEnd().split('\n');
          const next = lines.map((line) => line.endsWith('  entrances.geojson') ? `${digest}  entrances.geojson` : line);
          fs.writeFileSync(checksumPath, `${next.join('\n')}\n`);
          NODE
      - name: Validate canonical campus dataset
        run: node scripts/validate-campus-data.mjs
      - name: Commit synchronized snapshot and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/sync-osm-entrance-freshness.yml
          git add data/utm/entrances.geojson data/utm/SHA256SUMS .github/workflows/sync-osm-entrance-freshness.yml
          git diff --cached --exit-code && { echo "Expected synchronized data changes were not produced"; exit 1; } || true
          git commit -m "data(utm): refresh reviewed OSM entrance dates"
          git push origin HEAD:sync/osm-entrance-freshness-2026-09-14
