name: Core consumer contract

on:
  pull_request:
    paths:
      - data/utm/**
      - public/data/utm-campus-v1.json
      - scripts/**
      - tests/**
      - .github/workflows/core-consumer-contract.yml
  push:
    branches:
      - main
      - refactor/canonical-campus-data
    paths:
      - data/utm/**
      - public/data/utm-campus-v1.json
      - scripts/**
      - tests/**
      - .github/workflows/core-consumer-contract.yml

permissions:
  contents: read

jobs:
  core-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate canonical data
        uses: actions/checkout@v4
        with:
          path: gapwise-data

      - name: Check out current Gapwise core
        uses: actions/checkout@v4
        with:
          repository: Gapwise-for-UTM/gapwise
          ref: main
          path: gapwise

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Sync the complete candidate campus contract
        working-directory: gapwise
        run: |
          bun scripts/sync-campus-data.ts --write --source=../gapwise-data/data/utm
          bun scripts/sync-campus-data.ts --check --source=../gapwise-data/data/utm

      - name: Install core dependencies
        working-directory: gapwise
        run: bun install --frozen-lockfile

      - name: Typecheck core against candidate data
        working-directory: gapwise
        run: bun run typecheck

      - name: Run focused campus routing tests
        working-directory: gapwise
        run: >-
          bun test
          tests/public-campus-intelligence.test.ts
          tests/campus-routing-data.test.ts
          tests/utm-entrance-registry.test.ts
          tests/utm-routing-entrance-identity.test.ts
          tests/routing-golden-corpus.test.ts
          tests/transition-routing.test.ts
          tests/campus-day-route.test.ts
          tests/residence-routing.test.ts
          tests/gap-destination-feasibility.test.ts
          tests/location-presentation.test.ts
