name: Entrance visual review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - data/utm/entrances.geojson

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  link-visual-review:
    runs-on: ubuntu-latest
    steps:
      - name: Add visual review link
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- gapwise-entrance-visual-review -->';
            const reviewUrl = `https://data.gapwise.ca/review/entrances?pr=${context.issue.number}`;
            const body = `${marker}\n## 🗺️ Entrance visual review\n\n[Open this PR's entrance changes on the Gapwise map](${reviewUrl})\n\nNo raw GeoJSON or copy/paste required. The page compares the PR base and head datasets and highlights added, changed, and removed entrance points.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
